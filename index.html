<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Brasil | Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Estilos personalizados da aplicação -->
    <style>
        /* Define xo comportamento de rolagem da página */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 75px;
        }
        /* Personaliza o banner principal */
        .carousel-item img {
            height: 500px;
            object-fit: cover;
            filter: brightness(65%);
        } 

        /* Centralizar o texto sobre as imagens do carousel */
        .carousel-caption {
            bottom: 25%;
        }

        /* Mantém os cards com alturas semelhantes */
        .card {
            height: 100%;
            transition: transform 0.3s;
        }

        /* Cria um efeito visual quando o mouse passa sobte o card */
        .card:hover {
            transform: translateY(-5px);
        }
        /* Define uma altura padrão palra as imagens dos cards */
        .card-img-top {
            height: 220px;
            object-fit: cover;
        }
        /* Personaliza o rodapé */
        footer {
            background-color: #172b3a;
            color: white;
        }
        /* Evita que as imagens ultrapassem a largura do conteúdo */
        img {
            max-width: 100%;
        }
        /* Ajusta a altura do carousel em telas menores */
        @media (max-width: 768px) {
            .carousel-item img {
                height: 350px;
            }

            .carousel-caption {
                bottom: 10%;
            }

            .carousel-caption h1 {
                font-size: 1.7rem;
            }       
        }
    </style> 
</head>
<body>
    <!-- Menu superior -->
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
     <div class="container">

    <!-- Nome e logotipo textual da aplicação -->
     <a class="navbar-brand fw-bold" href="#inicio">
        Explore Brasil
     </a>

     <!-- Botão que abre o menu em dispositivos móveis -->
      <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuPrincipal"
      aria-expanded="false"
      aria-label="Abrir ou fechar menu">

      <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links de navegação por âncoras -->
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="#inicio">Inicio</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#destinos">Destinos</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#sobre">Sobre</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#contato">Contato</a>
            </li>

        </ul> 
      </div>

    </div> 
    </nav>

    <!-- Carousel de imagens -->
     <section id="inicio">
     <div id="carouselTurismo"
     class="carousel slide"
     data-bs-ride="carousel">

     <!-- Indicadores dos slides -->
      <div class="carousel-indicators">

         <button type="button"
         data-bs-target="#carouselTurismo"
         data-bs-slide-to="0"
         class="active"
         aria-current="true"
         aria-label="slide 1">
         </button>

         <button type="button"
         data-bs-target="#carouselTurismo"
         data-bs-slide-to="1"
         aria-label="slide 2">
         </button>

         <button type="button"
         data-bs-target="#carouselTurismo"
         data-bs-slide-to="2"
         aria-label="slide 3">
         </button>
      </div>

      <!-- Conteúdo dos slides -->
       <div class="carousel-inner">

        <!-- Primeiro Slide -->
         <div class="carousel-item active">
            <img 
            src="https://content.presspage.com/uploads/685/c1920_fernandodenoronhabrazil-2.jpg?65057"
            class="d-blockk w-100"
            alt="Praia tropical com mar azul">

            <div class="carousel-caption">
                <h1 class="fw-bold">
                    Descubra novos lugares
                </h1>
                <p class="lead">
                    Conheça paisagens incríveis pelo Brasil.
                </p>
                <a href="#destinos" class="btn btn-primary btn-lg">
                    Explorar destinos
                </a>

            </div>

         </div>

       </div>

     </div>

     </section>
</body>
</html>
